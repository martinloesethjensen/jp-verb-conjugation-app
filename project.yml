name: JPVerbConjugation
options:
  bundleIdPrefix: dev.martinloeseth
packages:
  VerbKit:
    path: Packages/VerbKit
targets:
  JPVerbConjugation:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "26.0"
      macOS: "26.0"
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: VerbKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Verb Table"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIImageName: LaunchImage
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.martinloeseth.jpverbconjugation
        PRODUCT_NAME: "JP Verb Conjugation"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: App/JPVerbConjugation.entitlements
        DEVELOPMENT_TEAM: "PUMQYPZ9HK"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

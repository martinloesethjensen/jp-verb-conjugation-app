name: JPVerbConjugation
options:
  bundleIdPrefix: dev.martinloeseth
packages:
  VerbKit:
    path: Packages/VerbKit
targets:
  JPVerbConjugation:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "26.0"
      macOS: "26.0"
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: VerbKit
      - target: VerbTableWidgets_${platform}
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Verb Table"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.martinloeseth.jpverbconjugation
            CFBundleURLSchemes:
              - verbtable
        UILaunchScreen:
          UIImageName: LaunchImage
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.martinloeseth.jpverbconjugation
        PRODUCT_NAME: "JP Verb Conjugation"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # MARKETING_VERSION and CURRENT_PROJECT_VERSION must match the VerbTableWidgets target; change both together.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: App/JPVerbConjugation.entitlements
        DEVELOPMENT_TEAM: "PUMQYPZ9HK"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  VerbTableWidgets:
    type: app-extension
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "26.0"
      macOS: "26.0"
    sources:
      - path: Widgets
        excludes:
          - Info.plist
      - path: App/VerbColors.swift
    dependencies:
      - package: VerbKit
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: "Verb Table"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.martinloeseth.jpverbconjugation.widgets
        PRODUCT_NAME: "VerbTableWidgets"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # Must match the JPVerbConjugation app target; change both together.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Widgets/VerbTableWidgets.entitlements
        DEVELOPMENT_TEAM: "PUMQYPZ9HK"

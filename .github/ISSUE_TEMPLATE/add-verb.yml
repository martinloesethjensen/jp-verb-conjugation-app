name: Add Verb Conjugation
description: Suggest a new Japanese verb to add to the conjugation table
title: "[VERB] <dict-form> — <meaning>"
labels: ["verb-addition"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing! Please fill in the nine conjugation forms below as completely as possible.
        The maintainers will verify accuracy before merging.

        You do **not** need to write the んです, potential (可能形) or auxiliary forms (ている, てしまう,
        てみる, すぎる, …). The app generates those from the forms below.

  - type: input
    id: dict
    attributes:
      label: Dictionary Form (辞書形)
      description: The plain/dictionary form of the verb in hiragana
      placeholder: "e.g. たべる"
    validations:
      required: true

  - type: input
    id: kanji
    attributes:
      label: Kanji Form
      description: The kanji writing of the verb (leave blank if none)
      placeholder: "e.g. 食べる"

  - type: input
    id: meaning
    attributes:
      label: English Meaning
      description: A concise English translation starting with "to"
      placeholder: "e.g. to eat"
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Verb Type
      description: What type of verb is this?
      options:
        - "ru — ru-verb (一段動詞, ends in -eru or -iru)"
        - "u — u-verb (五段動詞, all others, including look-alikes such as はいる, かえる, きる)"
        - "irr. — irregular (する or くる only)"
    validations:
      required: true

  - type: dropdown
    id: te_group
    attributes:
      label: て-form Group (u-verbs only)
      description: Which て-form sound change does this u-verb use?
      options:
        - "N/A — not a u-verb"
        - "tte (って) — verb ends in う / つ / る"
        - "nde (んで) — verb ends in む / ぶ / ぬ"
        - "ite (いて) — verb ends in く"
        - "ide (いで) — verb ends in ぐ"
        - "shite (して) — verb ends in す"
    validations:
      required: true

  - type: textarea
    id: forms
    attributes:
      label: Conjugation Forms
      description: Fill in every form. Check a Japanese dictionary (e.g. jisho.org) if unsure.
      value: |
        | Form                          | Value |
        |-------------------------------|-------|
        | Polite (ます)                  |       |
        | Polite · negative (ません)     |       |
        | Polite · past (ました)         |       |
        | Polite · past · negative (ませんでした) |       |
        | て-form                       |       |
        | Plain (dictionary form)       |       |
        | Plain · negative (ない)        |       |
        | Plain · past (た)              |       |
        | Plain · past · negative (なかった) |       |
    validations:
      required: true

  - type: dropdown
    id: potential
    attributes:
      label: Potential form (可能形)
      description: The app generates the potential form from the verb's class. Does that give the right result for this verb?
      options:
        - "Yes — a regular potential form exists"
        - "No — the verb has no potential form (like ある)"
        - "It has an irregular potential form (give it in the usage notes)"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: readings
    attributes:
      label: Readings for any kanji you use (optional)
      description: |
        Every kanji that appears in the verb, description, notes or examples needs a reading, or the
        data cannot be published. List each as `kanji = reading`, one per line.
      placeholder: |
        食 = た
        朝 = あさ

  - type: textarea
    id: description
    attributes:
      label: Description
      description: One or two sentences about what the verb means and how it is used
      placeholder: "e.g. A ru-verb meaning to eat. Drop the final る and add your ending."
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Usage Notes (optional)
      description: Important grammar notes, common collocations, or pitfalls for learners
      placeholder: "e.g. て-form たべて is used in sequences like たべてから (after eating)."

  - type: textarea
    id: examples
    attributes:
      label: Example Sentences (optional)
      description: |
        Provide 2–5 example sentences. One per block, Japanese on one line, English on the next.
        Indicate which of the nine conjugation forms each example uses. Write natural English, not a
        word-for-word gloss: learners can send examples to a translation app from the verb page.
      placeholder: |
        Form: masu_pos
        JP: あさごはんをたべます。
        EN: I eat breakfast.

        Form: te
        JP: たべてから、でかけます。
        EN: After eating, I'll go out.

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: I have verified the conjugations using a reliable source (e.g. jisho.org, a textbook)
          required: true
        - label: All nine conjugation forms are filled in
          required: true
        - label: The verb is not already in the table
          required: true

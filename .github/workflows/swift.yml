name: Swift

# Builds VerbKit and runs its tests on macOS. VerbKit uses SwiftData and CryptoKit, so
# it only builds on Apple platforms. The Real* tests read data/, so data changes run it too.
on:
  pull_request:
    paths:
      - "Packages/**"
      - "data/**"
      - ".github/workflows/swift.yml"
  push:
    branches: [main]
    paths:
      - "Packages/**"
      - "data/**"
      - ".github/workflows/swift.yml"

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: swift test (VerbKit)
    # Standard runner: free on public repositories. Its default Xcode supports Swift tools 6.2.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift --version
      - name: Test
        working-directory: Packages/VerbKit
        run: swift test

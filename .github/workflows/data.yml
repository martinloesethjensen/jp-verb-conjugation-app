name: Data

# Catches an unsigned, stale or tampered data/ before apps see it.
on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "Packages/VerbKit/Sources/VerbKit/Data/ManifestSignatureVerifier.swift"]
  pull_request:
    paths: ["data/**", "scripts/**", "Packages/VerbKit/Sources/VerbKit/Data/ManifestSignatureVerifier.swift"]

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Script tests
        run: python3 -m unittest discover -s scripts
      - name: Data is generated and valid
        run: python3 scripts/update_data.py --check
      - name: Manifest is signed by the key the app trusts
        run: python3 scripts/sign_manifest.py verify

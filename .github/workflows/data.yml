name: Data

# Catches stale, invalid or tampered data/ before apps see it.
# Feature pull requests are not signed: the owner signs once per batch with `make data-release`
# (docs/security/data-signing.md). So the signature is checked on main, where a red run means
# "merged but not released yet" (apps keep their cached data meanwhile), and on the
# data-release/* pull request that publishes the batch.
on:
  push:
    branches: [main]
    paths: ["data/**", "schema/**", "scripts/**", "Packages/VerbKit/Sources/VerbKit/Data/ManifestSignatureVerifier.swift"]
  pull_request:
    paths: ["data/**", "schema/**", "scripts/**", "Packages/VerbKit/Sources/VerbKit/Data/ManifestSignatureVerifier.swift"]

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      # update_data.py --check compares verb ids with the published verbs.json, so it needs main.
      - name: Fetch the published data
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - name: Script tests
        run: python3 -m unittest discover -s scripts
      - name: Data is generated and valid
        run: python3 scripts/update_data.py --check
      - name: Manifest is signed by the key the app trusts
        if: github.event_name == 'push' || startsWith(github.head_ref, 'data-release/')
        run: python3 scripts/sign_manifest.py verify

[package]
name = "review-api"
version = "0.1.0"
edition = "2021"
publish = false
description = "The review site's API: a Cloudflare Worker that checks Access sign-in and serves review data."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
form_urlencoded = "1"
getrandom = "0.2"
rsa = { version = "0.9", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = { version = "0.10", features = ["oid"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8.7", features = ["d1"] }
# The Web Crypto backend for getrandom on wasm32 (load ids; rsa's rand_core needs it to compile).
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
rand = "0.8"
rsa = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt"] }

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true

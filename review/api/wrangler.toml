# The review site's API Worker. It answers only on review.martinloeseth.dev/api/*, behind Cloudflare Access.
# Account details (team domain, the two AUD tags) are secrets: see review/README.md. Nothing secret goes here.
name = "verbtable-review-api"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "review.martinloeseth.dev/api/*", zone_name = "martinloeseth.dev" }]

[build]
command = "cargo install -q worker-build@0.8.7 --locked && worker-build --release"

[vars]
SITE_ORIGIN = "https://review.martinloeseth.dev"

[[d1_databases]]
binding = "DB"
database_name = "verbtable-review"
# Fill in from `npx wrangler d1 create verbtable-review` (review/README.md, step 1). Not a secret.
database_id = "set-by-owner"
migrations_dir = "migrations"
